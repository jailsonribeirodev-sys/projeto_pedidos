services:
  # Banco de Dados de Pedidos
  order:
    image: postgres:17
    container_name: order
    restart: unless-stopped
    ports:
      - "5433:5432" # Acessível na sua API Java via localhost:5433
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order
    volumes:
      - pgdata-order:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Interface de Gerenciamento pgAdmin 4
  pgadmin4:
    image: dpage/pgadmin4
    container_name: pgadmin4
    restart: unless-stopped
    ports:
      - "15432:80" # Acessível no seu navegador via http://localhost:15432
    environment:
      PGADMIN_DEFAULT_EMAIL: jailson.ribeirodev@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      order:
        condition: service_healthy

volumes:
  pgdata-order: